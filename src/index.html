<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quote of the Day with local favoriting persistence">
  <title>Quote of the Day</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div class="app-wrapper">
    <header class="app-header">
      <h1 class="app-title">Quote of the Day</h1>
      <p class="app-subtitle">Daily wisdom, reflection, and inspiration</p>
    </header>

    <div id="storage-warning" class="storage-warning is-hidden" role="alert">
      <span>⚠️ Browser storage is disabled or unavailable. Favorites will only be kept for this active session.</span>
    </div>

    <main class="main-content">
      <!-- Active Quote Card -->
      <section id="quote-card" class="quote-card" aria-live="polite">
        <blockquote id="quote-text" class="quote-text">Loading daily quote...</blockquote>
        <cite id="quote-author" class="quote-author"></cite>
      </section>

      <!-- Action Controls -->
      <div class="actions-toolbar">
        <button id="btn-new-quote" class="btn btn-primary" type="button" aria-label="Show new random quote">
          <span class="btn-icon">↻</span> New quote
        </button>
        <button id="btn-favorite" class="btn btn-secondary" type="button" aria-pressed="false" aria-label="Toggle favorite">
          <span class="btn-icon heart-icon">♥</span> Favorite
        </button>
        <button id="btn-view-favorites" class="btn btn-outline" type="button" aria-expanded="false">
          View Favorites (0)
        </button>
      </div>

      <!-- Saved Favorites Panel -->
      <section id="favorites-container" class="favorites-container is-hidden" aria-label="Saved Favorite Quotes">
        <div class="favorites-header">
          <h2 class="favorites-title">Your Saved Favorites</h2>
        </div>
        <ul id="favorites-list" class="favorites-list"></ul>
      </section>
    </main>

    <footer class="app-footer">
      <p>Curated quotes • Stored locally on your device</p>
    </footer>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
